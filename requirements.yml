  - name: ansible.posix
  - name: community.docker      # Lab 08
  - name: amazon.aws            # Labs 09, 20
    version: ">=11.2.0"
  - name: kubernetes.core       # Labs 10, 18
  - name: awx.awx               # Lab 17 (bonus step)
