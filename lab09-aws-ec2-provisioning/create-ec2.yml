---
- name: Provision an EC2 instance
  hosts: local
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Stop early if my_ip_cidr hasn't been set
      ansible.builtin.assert:
        that:
          - my_ip_cidr is match('^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$')
        fail_msg: "Set my_ip_cidr in vars.yml (or pass -e my_ip_cidr=x.x.x.x/32)"

    - name: Look up the latest Amazon Linux 2023 AMI
      ansible.builtin.set_fact:
        ami_id: "{{ lookup('amazon.aws.ssm_parameter', ami_ssm_parameter, region=aws_region) }}"

    - name: Create an SSH key pair and save the private key
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ aws_region }}"
        file_name: "{{ key_file }}"
        tags: "{{ common_tags }}"

    - name: Create a security group that allows SSH from your IP only
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        description: SSH access for Ansible Lab 09
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: "{{ my_ip_cidr }}"
            rule_desc: SSH from my IP
        tags: "{{ common_tags }}"

    - name: Launch the instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        region: "{{ aws_region }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        security_group: "{{ security_group_name }}"
        tags: "{{ common_tags }}"
        state: running
        wait: true
      register: ec2

    - name: Show the new instance
      ansible.builtin.debug:
        msg: "{{ ec2.instances[0].instance_id }} is running at {{ ec2.instances[0].public_ip_address }}"

    - name: Add the instance to an in-memory inventory group
      ansible.builtin.add_host:
        name: "{{ ec2.instances[0].public_ip_address }}"
        groups: lab09_servers
        ansible_user: ec2-user
        ansible_ssh_private_key_file: "{{ key_file }}"
        ansible_python_interpreter: /usr/bin/python3

- name: Configure the new instance
  hosts: lab09_servers
  gather_facts: false
  become: true
  tasks:
    - name: Wait until SSH works (new instances take a minute to boot)
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts now that we can connect
      ansible.builtin.setup:

    - name: Set a login message
      ansible.builtin.copy:
        dest: /etc/motd
        content: "Provisioned and configured by Ansible (Lab 09)\n"
        mode: "0644"

    - name: Show what we connected to
      ansible.builtin.debug:
        msg: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}, {{ ansible_facts['memtotal_mb'] }} MB RAM"
