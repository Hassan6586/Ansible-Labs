---
- name: Remove everything Lab 09 created (stops the charges)
  hosts: local
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Terminate the instance
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ instance_name }}"
          "tag:Project": "{{ common_tags.Project }}"
        state: absent
        wait: true

    - name: Delete the security group
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        region: "{{ aws_region }}"
        state: absent

    - name: Delete the key pair in AWS
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ aws_region }}"
        state: absent

    - name: Delete the local private key
      ansible.builtin.file:
        path: "{{ key_file }}"
        state: absent
