---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable the default site (it listens on port 80)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Write the reverse proxy site
  ansible.builtin.template:
    src: visit-counter.conf.j2
    dest: /etc/nginx/sites-available/visit-counter.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/visit-counter.conf
    dest: /etc/nginx/sites-enabled/visit-counter.conf
    state: link
  notify: Reload nginx

- name: Test the nginx configuration before reloading
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Make sure nginx is running and starts on boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
