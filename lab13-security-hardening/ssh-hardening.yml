---
# Baseline hardening for an Ubuntu server. Read the README warnings before running on a remote machine.
- name: Security hardening baseline
  hosts: local
  become: true

  vars:
    hardening_ssh_max_auth_tries: 3
    # Only set this to true AFTER key-based login works (Lab 01), or you may lock yourself out.
    hardening_ssh_disable_passwords: false
    hardening_fail2ban_bantime: 1h
    hardening_fail2ban_findtime: 10m
    hardening_fail2ban_maxretry: 5

  tasks:
    - name: Install security packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ---- SSH ----------------------------------------------------------------
    - name: Write SSH hardening settings (validated with sshd -t before saving)
      ansible.builtin.template:
        src: 01-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/01-hardening.conf
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    # ---- Firewall -------------------------------------------------------------
    - name: Allow SSH through the firewall FIRST (so we can't lock ourselves out)
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Deny all other incoming traffic by default
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Allow all outgoing traffic by default
      community.general.ufw:
        default: allow
        direction: outgoing

    - name: Turn the firewall on
      community.general.ufw:
        state: enabled

    # ---- Brute-force protection -----------------------------------------------
    - name: Configure fail2ban for SSH
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        mode: "0644"
      notify: Restart fail2ban

    - name: Make sure fail2ban is running
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # ---- Automatic security updates -------------------------------------------
    - name: Turn on automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    # ---- Small but important ----------------------------------------------------
    - name: Make sure /etc/shadow is readable only by root and the shadow group
      ansible.builtin.file:
        path: /etc/shadow
        owner: root
        group: shadow
        mode: "0640"

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
