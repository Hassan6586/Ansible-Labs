---
# Step 5: undo the last image change (like: kubectl rollout undo)
- name: Roll the Deployment back to the previous version
  hosts: local
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Roll back one revision
      kubernetes.core.k8s_rollback:
        api_version: apps/v1
        kind: Deployment
        name: "{{ app_name }}"
        namespace: "{{ k8s_namespace }}"

    - name: Wait until the old version is running everywhere
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ app_name }}"
        namespace: "{{ k8s_namespace }}"
        wait: true
        wait_timeout: 180

    - name: Show the result
      ansible.builtin.include_tasks: tasks/show-status.yml
