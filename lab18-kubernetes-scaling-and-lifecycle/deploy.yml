---
# Step 2 (create) and Step 4 (update the image):
#   ansible-playbook deploy.yml
#   ansible-playbook deploy.yml -e image_tag=1.28
- name: Create or update the nginx Deployment
  hosts: local
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Create the namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ k8s_namespace }}"
        state: present

    - name: Apply the Deployment and wait for the rollout to finish
      kubernetes.core.k8s:
        state: present
        template: deployment.yml.j2
        wait: true
        wait_timeout: 180

    - name: Expose it with a Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ k8s_namespace }}"
          spec:
            selector:
              app: "{{ app_name }}"
            ports:
              - port: 80
                targetPort: 80

    - name: Show the result
      ansible.builtin.include_tasks: tasks/show-status.yml
