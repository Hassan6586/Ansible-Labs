# The inventory: the list of machines Ansible manages, sorted into groups.

# Group 1: this machine, reached directly (no SSH)
[local]
localhost ansible_connection=local

# Group 2: the same machine, but reached over SSH like a real remote server.
# ansible_host is the address Ansible connects to.
[remote]
lab-node ansible_host=127.0.0.1

# Variables that apply to every host in the [remote] group
[remote:vars]
ansible_ssh_private_key_file=~/.ssh/ansible_key

# Variables that apply to every host
[all:vars]
ansible_python_interpreter=/usr/bin/python3
