---
# A YAML inventory. "children" are sub-groups; "hosts" are machines.
# These IPs are examples: this lab only reads the inventory, it never connects.
all:
  children:
    production:
      children:
        webservers:
          hosts:
            web1:
              ansible_host: 192.168.1.10
            web2:
              ansible_host: 192.168.1.11
        databases:
          hosts:
            db1:
              ansible_host: 192.168.1.20
    staging:
      hosts:
        stage-web1:
          ansible_host: 10.10.0.10
