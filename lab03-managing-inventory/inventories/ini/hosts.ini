# The same idea as the YAML inventory, written in INI format.

[webservers]
web1 ansible_host=192.168.1.10
web2 ansible_host=192.168.1.11

[databases]
db1 ansible_host=192.168.1.20

# A group made of other groups ("children")
[production:children]
webservers
databases

[production:vars]
env_type=production
